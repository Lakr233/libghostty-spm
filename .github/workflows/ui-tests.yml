name: UI Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ui-tests-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: ${{ matrix.label }} Simulator UI Tests
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: ios
            label: iPhone
            devices: iPhone Air|iPhone 16|iPhone
          - slug: ipad
            label: iPad
            devices: iPad Air 13-inch (M3)|iPad Air 13-inch|iPad Pro 13-inch|iPad
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Xcode Version
        run: xcodebuild -version

      - name: Run ${{ matrix.label }} UI Tests
        env:
          DEVICE_LABEL: ${{ matrix.label }}
          # Device type patterns, most specific first; the first match wins.
          DEVICE_PATTERNS: ${{ matrix.devices }}
          RESULT_BUNDLE: ${{ runner.temp }}/libghostty-ui-${{ matrix.slug }}.xcresult
        run: |
          set -euo pipefail
          rm -rf "$RESULT_BUNDLE"
          RUNTIME=$(xcrun simctl list runtimes available | awk '/^iOS .*com\.apple\.CoreSimulator\.SimRuntime\.iOS/ { runtime=$NF } END { print runtime }')
          [ -n "$RUNTIME" ] || { echo "no available iOS simulator runtime"; exit 1; }
          DEVICE=
          IFS='|' read -ra PATTERNS <<< "$DEVICE_PATTERNS"
          for pattern in "${PATTERNS[@]}"; do
            DEVICE=$(xcrun simctl list devicetypes | sed -n "/$pattern/s/.*(\(com\.apple\.CoreSimulator\.SimDeviceType\.[^)]*\)).*/\1/p" | head -1)
            if [ -n "$DEVICE" ]; then break; fi
          done
          [ -n "$DEVICE" ] || { echo "no available $DEVICE_LABEL simulator device type"; exit 1; }
          UDID=$(xcrun simctl create "libghostty-ui-${DEVICE_LABEL}-${GITHUB_RUN_ID}" "$DEVICE" "$RUNTIME")
          trap 'xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true; xcrun simctl delete "$UDID" >/dev/null 2>&1 || true' EXIT
          # Hosted runner cleanup: avoid stale simulator windows stealing UI automation focus.
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild test \
            -project Example/MobileGhosttyApp.xcodeproj \
            -scheme MobileGhosttyApp \
            -destination "id=$UDID" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload ${{ matrix.label }} Result Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libghostty-ui-${{ matrix.slug }}-xcresult
          path: ${{ runner.temp }}/libghostty-ui-${{ matrix.slug }}.xcresult
          retention-days: 7

  mac-catalyst:
    name: Mac Catalyst UI Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Xcode Version
        run: xcodebuild -version

      - name: Run Mac Catalyst UI Tests
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/libghostty-ui-maccatalyst.xcresult"
          xcodebuild test \
            -project Example/MobileGhosttyApp.xcodeproj \
            -scheme MobileGhosttyApp \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -resultBundlePath "$RUNNER_TEMP/libghostty-ui-maccatalyst.xcresult" \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload Mac Catalyst Result Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libghostty-ui-maccatalyst-xcresult
          path: ${{ runner.temp }}/libghostty-ui-maccatalyst.xcresult
          retention-days: 7

  macos-appkit:
    name: macOS AppKit UI Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Xcode Version
        run: xcodebuild -version

      - name: Run macOS AppKit UI Tests
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/libghostty-ui-macos.xcresult"
          xcodebuild test \
            -project Example/GhosttyTerminalApp.xcodeproj \
            -scheme GhosttyTerminalApp \
            -destination 'platform=macOS' \
            -resultBundlePath "$RUNNER_TEMP/libghostty-ui-macos.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload macOS AppKit Result Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libghostty-ui-macos-xcresult
          path: ${{ runner.temp }}/libghostty-ui-macos.xcresult
          retention-days: 7
