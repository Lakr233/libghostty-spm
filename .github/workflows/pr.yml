name: PR Build & Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Zero-scope GITHUB_TOKEN: PR runs untrusted contributor code, so the
# token gets no permissions at all. Public repo, so checkout works
# without auth. No secrets referenced anywhere in this workflow.
permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift Version
        run: swift --version

      - name: Check Licenses
        run: ./Script/check-licenses.sh

      - name: Check Binary Source Notices
        run: |
          source=$(mktemp -d)
          git init -q "$source"
          git -C "$source" remote add origin https://github.com/ghostty-org/ghostty
          git -C "$source" fetch --depth=1 --filter=blob:none origin "$(tr -d '[:space:]' < Ghostty.ref)"
          git -C "$source" sparse-checkout set --no-cone /LICENSE '/NOTICE*' /include/ghostty.h
          git -C "$source" checkout --detach FETCH_HEAD
          ./Script/test-source-notices.sh "$source"

      - name: Check Localizations
        run: ./Script/generate-localizations.sh --check

      - name: Build Package Matrix
        run: ./Script/test.sh

      - name: Swift Test
        run: swift test
